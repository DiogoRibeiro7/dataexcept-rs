name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  rust:
    name: Shared Rust CI
    uses: DiogoRibeiro7/git-actions-collection/.github/workflows/rust-ci.yml@v1
    with:
      all-features: true
      locked: false
      run-compatibility: true
      compatibility-toolchains: '["1.85.0"]'
      compatibility-os: '["ubuntu-latest"]'

  extras:
    name: Documentation and examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Documentation
        run: cargo doc --no-deps --all-features

      - name: Check examples
        run: cargo check --examples --all-features

  features:
    name: Optional feature matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check core only
        run: cargo check --no-default-features

      - name: Check tracing feature
        run: cargo check --no-default-features --features tracing

      - name: Check OpenTelemetry feature
        run: cargo check --no-default-features --features opentelemetry

      - name: Check Sentry feature
        run: cargo check --no-default-features --features sentry

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Check feature powerset
        run: cargo hack check --feature-powerset --no-dev-deps

  package:
    name: Package validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: List package contents
        run: cargo package --list

      - name: Build package
        run: cargo package

  semver:
    name: SemVer compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine release stage
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$version" == *"-alpha."* ]]; then
            echo "enforce=false" >> "$GITHUB_OUTPUT"
            echo "Alpha release detected; SemVer compatibility remains advisory until beta."
          else
            echo "enforce=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine baseline tag
        if: steps.release.outputs.enforce == 'true'
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          test -n "$tag" || {
            echo "No previous release tag found for SemVer baseline" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using $tag as the SemVer baseline"

      - name: Check SemVer compatibility
        if: steps.release.outputs.enforce == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          baseline-rev: ${{ steps.baseline.outputs.tag }}
          feature-group: all-features
