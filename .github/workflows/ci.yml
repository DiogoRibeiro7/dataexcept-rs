name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Documentation
        run: cargo doc --no-deps --all-features

      - name: Check examples
        run: cargo check --examples --all-features

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check all features on MSRV
        run: cargo check --all-features

  features:
    name: Optional feature matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check core only
        run: cargo check --no-default-features

      - name: Check tracing feature
        run: cargo check --no-default-features --features tracing

      - name: Check OpenTelemetry feature
        run: cargo check --no-default-features --features opentelemetry

      - name: Check Sentry feature
        run: cargo check --no-default-features --features sentry

  package:
    name: Package validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: List package contents
        run: cargo package --list

      - name: Build package
        run: cargo package

  semver:
    name: SemVer compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release stage
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$version" == *"-alpha."* ]]; then
            echo "enforce=false" >> "$GITHUB_OUTPUT"
            echo "Alpha release detected; SemVer compatibility remains advisory until beta."
          else
            echo "enforce=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine baseline tag
        if: steps.release.outputs.enforce == 'true'
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          test -n "$tag" || {
            echo "No previous release tag found for SemVer baseline" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using $tag as the SemVer baseline"

      - name: Check SemVer compatibility
        if: steps.release.outputs.enforce == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          baseline-rev: ${{ steps.baseline.outputs.tag }}
          feature-group: all-features
