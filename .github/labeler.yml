documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "CITATION.cff"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/dependabot.yml"
          - ".github/labeler.yml"
          - ".github/release.yml"
          - "deny.toml"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "Cargo.toml"
          - "Cargo.lock"
          - "deny.toml"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"

protocol:
  - changed-files:
      - any-glob-to-any-file:
          - "src/protocol.rs"
          - "schemas/**"
          - "tests/fixtures/**"
          - "PROTOCOL_STABILITY.md"

observability:
  - changed-files:
      - any-glob-to-any-file:
          - "src/observability.rs"
          - "src/trace_context.rs"
          - "src/tracing_integration.rs"
          - "src/opentelemetry_integration.rs"
          - "src/sentry_integration.rs"
          - "src/boundaries.rs"

release:
  - head-branch:
      - "^release/"

feature:
  - head-branch:
      - "^feat/"

maintenance:
  - head-branch:
      - "^chore/"
