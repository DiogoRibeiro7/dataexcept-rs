[package]
name = "dataexcept"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
authors = ["Diogo Ribeiro"]
description = "Structured errors and failure observability for data, ML, and data-engineering systems"
license = "MIT"
repository = "https://github.com/DiogoRibeiro7/dataexcept-rs"
homepage = "https://github.com/DiogoRibeiro7/dataexcept-rs"
documentation = "https://docs.rs/dataexcept"
readme = "README.md"
keywords = ["errors", "observability", "data", "ml", "serialization"]
categories = ["rust-patterns", "development-tools::debugging"]

[features]
default = []
opentelemetry = ["dep:opentelemetry"]
sentry = []
tracing = ["dep:tracing"]

[dependencies]
form_urlencoded = "1.2"
opentelemetry = { version = "0.33", optional = true, default-features = false, features = ["trace"] }
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = { version = "0.1.44", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
jsonschema = { version = "0.52.1", default-features = false }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
